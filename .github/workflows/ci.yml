name: Docker CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        working-directory: backend
        run: |
          docker build -t myapp:${{ github.sha }} .

      - name: Run Tests Inside Container
        run: |
          docker run --rm myapp:${{ github.sha }} npm test

      - name: Tag Latest Image
        run: |
          docker tag myapp:${{ github.sha }} \
          yourdockerhubusername/myapp:latest

      - name: Tag Commit Image
        run: |
          docker tag myapp:${{ github.sha }} \
          yourdockerhubusername/myapp:${{ github.sha }}

      - name: Push Latest Image
        run: |
          docker push yourdockerhubusername/myapp:latest

      - name: Push Commit Tag
        run: |
          docker push yourdockerhubusername/myapp:${{ github.sha }}
